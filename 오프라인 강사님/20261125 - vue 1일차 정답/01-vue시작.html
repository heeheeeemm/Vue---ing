<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <div id="app">
  <!-- {{}} : 콧수염괄호 -->
    <h1>{{message}}</h1>

    <!-- v-on:click : 클릭 이벤트를 감지했을때 -->
    <button @click="count++">
      Count is : {{count}}
    </button>

  </div>



<!-- vue 사용방법
1. CDN
2. node.js 런타임을 설치하면 npm명령어 -> vue3프레임워크 설치 -->

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>

    // 1. 구조분해할당
    // vue에서 사용할 함수들을 '구조분해할당'으로 가져옴
    // ref : 반응형 변수를 생성하는 함수
    const {createApp, ref} = Vue

    // 2. createApp 함수
    const app = createApp({
      setup() {
        // ref 반응형 변수
        const message = ref('Hello vue!!')
        const count = ref(0)
        
        return {
          message,
          count
        }
      }
    })
    // 3. mount
    app.mount('#app')

  </script>

</body>

</html>
