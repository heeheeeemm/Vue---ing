<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 이벤트 처리</title>
</head>

<body>
  <div id="app">
    <!-- [실습 포인트/힌트] v-on:이벤트이름="setup에서 return한 함수 이름" -->
    <button v-on:click="increment">증가</button>
    <button v-on:click="decrement">감소</button>
    <p>{{ number }}</p>
    <p>{{ number }}</p>
    <p>{{ number }}</p>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue

    const app = createApp({
      setup() {
        const number = ref(0)
        const increment = function () {
          number.value++
        }
        const decrement = function () {
          number.value--
        }
        return {
          number,
          increment,
          decrement,
        }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
